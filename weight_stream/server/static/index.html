<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weight Streaming</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   Design System — Dark-first, purple/teal palette
   ═══════════════════════════════════════════════════════════════════ */
:root {
  --bg: #0f0f1a;
  --surface: #1a1a2e;
  --surface2: #252540;
  --border: #333355;
  --text: #e0e0e0;
  --text-dim: #8888aa;
  --primary: #6c5ce7;
  --primary-glow: rgba(108,92,231,0.3);
  --secondary: #00cec9;
  --accent: #fd79a8;
  --success: #4ade80;
  --error: #ef4444;
  --warn: #f59e0b;
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
  --transition: 0.2s ease;
}

[data-theme="light"] {
  --bg: #f5f5ff;
  --surface: #ffffff;
  --surface2: #eeeeff;
  --border: #ddddee;
  --text: #1a1a2e;
  --text-dim: #666688;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background var(--transition);
}

/* ── Header ───────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
header h1 {
  font-size: 1.2em;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
#server-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8em;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--surface2);
}
#server-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--error);
  transition: background 0.3s;
}
#server-dot.online { background: var(--success); }
#server-url { color: var(--text-dim); }

/* ── Tabs ──────────────────────────────────────────────────── */
nav {
  display: flex;
  gap: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
}
nav button {
  background: none; border: none; color: var(--text-dim);
  padding: 10px 20px; font-size: 0.9em; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all var(--transition);
  font-family: var(--font);
}
nav button:hover { color: var(--text); }
nav button.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

/* ── Main Area ─────────────────────────────────────────────── */
main {
  flex: 1;
  display: flex;
  gap: 0;
  overflow: hidden;
}

/* ── Chat Tab ──────────────────────────────────────────────── */
#tab-chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
}
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: var(--radius);
  line-height: 1.5;
  font-size: 0.9em;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
.message.user {
  align-self: flex-end;
  background: var(--primary);
  color: #fff;
  border-bottom-right-radius: 4px;
}
.message.assistant {
  align-self: flex-start;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}
.message.error {
  background: #3a1a1a;
  border-color: var(--error);
  color: var(--error);
}
.message .role {
  font-size: 0.7em;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
  opacity: 0.7;
}

#chat-input-area {
  padding: 12px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
#chat-input-area input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.9em;
  font-family: var(--font);
  outline: none;
  transition: border var(--transition);
}
#chat-input-area input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
button.primary {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 0.9em;
  font-family: var(--font);
  transition: all var(--transition);
}
button.primary:hover {
  opacity: 0.9;
  box-shadow: 0 0 12px var(--primary-glow);
}
button.primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ── Stats Tab ─────────────────────────────────────────────── */
#tab-stats {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.stat-card .stat-value {
  font-size: 1.4em;
  font-weight: 700;
  color: var(--primary);
  margin-top: 4px;
}
.stat-card .stat-label {
  font-size: 0.75em;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Models Tab ────────────────────────────────────────────── */
#tab-models {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.model-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.model-card .model-name {
  font-weight: 600;
}
.model-card .model-meta {
  font-size: 0.8em;
  color: var(--text-dim);
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7em;
  font-weight: 600;
}
.badge.loaded { background: #1a3a1a; color: var(--success); }
.badge.unloaded { background: #3a3a1a; color: var(--warn); }

.load-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 16px;
}
.load-form h3 { margin-bottom: 12px; font-size: 1em; }
.form-row {
  display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
}
.form-row input, .form-row select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface2);
  color: var(--text);
  font-size: 0.85em;
  font-family: var(--font);
}
.form-row label {
  font-size: 0.8em;
  color: var(--text-dim);
  display: block;
  margin-bottom: 4px;
}

/* ── Footer ────────────────────────────────────────────────── */
footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 20px;
  font-size: 0.75em;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
}

/* ── Theme Toggle ──────────────────────────────────────────── */
#theme-toggle {
  background: none; border: none;
  font-size: 1.1em; cursor: pointer;
  padding: 4px 8px; border-radius: var(--radius-sm);
}
#theme-toggle:hover { background: var(--surface2); }

/* ── Loading ───────────────────────────────────────────────── */
.loading {
  display: inline-block;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim);
  animation: pulse 1s ease infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ── Responsive ────────────────────────────────────────────── */
@media (max-width: 600px) {
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .message { max-width: 90%; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     Header
     ══════════════════════════════════════════════════════════════ -->
<header>
  <h1>Weight Streaming</h1>
  <div class="header-right">
    <div id="server-status">
      <span id="server-dot"></span>
      <span id="server-url">http://127.0.0.1:8765</span>
    </div>
    <button id="theme-toggle" title="Toggle theme">🌓</button>
  </div>
</header>

<!-- ══════════════════════════════════════════════════════════════
     Tab Navigation
     ══════════════════════════════════════════════════════════════ -->
<nav>
  <button class="active" data-tab="chat">Chat</button>
  <button data-tab="stats">Stats</button>
  <button data-tab="models">Models</button>
</nav>

<!-- ══════════════════════════════════════════════════════════════
     Main Content
     ══════════════════════════════════════════════════════════════ -->
<main>

  <!-- Chat Tab -->
  <div id="tab-chat" style="display:flex;">
    <div id="chat-messages">
      <div class="message assistant">
        <div class="role">System</div>
        Load a model to start chatting. Go to the <b>Models</b> tab or use the API server.
      </div>
    </div>
    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Type a message... (Enter to send)" />
      <button class="primary" id="send-btn">Send</button>
      <button class="primary" id="stop-btn" style="background:var(--error);display:none;">Stop</button>
      <button onclick="clearChatHistory();chatMessages.innerHTML='';" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85em;font-family:var(--font);" title="Clear chat history">Clear</button>
    </div>
  </div>

  <!-- Stats Tab -->
  <div id="tab-stats" style="display:none;">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="stat-label">Loading...</div></div>
    </div>
  </div>

  <!-- Models Tab -->
    <div id="tab-models" style="display:none;">
     <div id="models-list"></div>

     <!-- Scan Directory -->
      <div class="load-form" style="margin-bottom:16px;">
       <h3>Scan Models</h3>
       <p style="font-size:0.8rem;color:var(--text-dim);margin-bottom:8px;">
         Quick-scan common directories or enter a custom path.
       </p>
       <div class="form-row" style="margin-bottom:8px;">
         <button onclick="browseModel()" style="background:var(--primary);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85em;font-family:var(--font);font-weight:600;">Browse Model File</button>
         <button onclick="browseDir()" style="background:var(--secondary);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85em;font-family:var(--font);font-weight:600;">Browse Folder</button>
         <span style="font-size:0.75rem;color:var(--text-dim);align-self:center;">or scan below</span>
       </div>
       <div class="form-row" style="margin-bottom:8px;">
         <button onclick="scanModels()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8em;font-family:var(--font);">Scan Default Dirs</button>
         <button onclick="scanDirCustom()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8em;font-family:var(--font);">Scan Custom Path</button>
       </div>
       <div class="form-row">
         <div style="flex:1;">
           <input type="text" id="scan-dir" placeholder="Or enter custom directory path..." style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:0.85em;font-family:var(--font);" />
         </div>
         <div style="display:flex;align-items:flex-end;gap:4px;">
           <button class="primary" id="scan-dir-btn" style="font-size:0.8em;padding:8px 12px;">Scan</button>
         </div>
       </div>
       <div class="form-row" style="margin-top:8px;">
         <div style="flex:1;">
           <select id="model-picker" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:0.85em;font-family:var(--font);">
             <option value="">-- Select a model --</option>
           </select>
         </div>
       </div>
     </div>

     <!-- Load Form -->
     <div class="load-form" id="load-section">
       <h3 id="load-header">Load Model</h3>
       <div class="form-row">
         <div>
           <label>Model Path</label>
           <input type="text" id="load-path" placeholder="path/to/model.gguf" style="width:300px;" />
         </div>
         <div>
           <label>Model ID</label>
           <input type="text" id="load-id" value="default" style="width:150px;" />
         </div>
       </div>
       <div class="form-row">
         <div>
           <label>Buffer (MB)</label>
           <input type="number" id="load-buffer" value="64" min="1" style="width:100px;" />
         </div>
         <div>
           <label>Context</label>
           <input type="number" id="load-ctx" value="512" min="8" style="width:100px;" />
         </div>
         <div style="display:flex;align-items:flex-end;gap:8px;">
           <button class="primary" id="load-btn">Load Model</button>
           <button id="reload-btn" style="display:none;background:var(--warn);color:#000;border:none;padding:10px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.85em;font-family:var(--font);">Reload (Force)</button>
         </div>
       </div>
       <p id="load-msg" style="margin-top:8px;font-size:0.8rem;"></p>
     </div>
   </div>

</main>

<!-- ══════════════════════════════════════════════════════════════
     Footer
     ══════════════════════════════════════════════════════════════ -->
<footer>
  <span>weight-streaming v0.11.0</span>
  <span id="stats-footer">--</span>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   Application State
   ═══════════════════════════════════════════════════════════════ */
const API = 'http://127.0.0.1:8765';
let currentModel = 'default';
let abortController = null;
let scanned = false;
let conversationHistory = [];

// Load chat history from localStorage
try {
  const saved = localStorage.getItem('ws-chat-history');
  if (saved) conversationHistory = JSON.parse(saved);
} catch(e) {}

function saveChatHistory() {
  try { localStorage.setItem('ws-chat-history', JSON.stringify(conversationHistory.slice(-20))); } catch(e) {}
}

function restoreChatUI() {
  if (conversationHistory.length > 0) {
    chatMessages.innerHTML = '';
    for (var i = 0; i < conversationHistory.length; i++) {
      var msg = conversationHistory[i];
      addMessage(msg.role, msg.content, false);
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
}

function clearChatHistory() {
  conversationHistory = [];
  localStorage.removeItem('ws-chat-history');
}

/* ═══════════════════════════════════════════════════════════════
   API Helpers
   ═══════════════════════════════════════════════════════════════ */
async function api(path, opts = {}) {
  const url = API + path;
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: res.statusText }));
    throw new Error(err.detail || err.error || `HTTP ${res.status}`);
  }
  return res;
}

async function apiJSON(path, body) {
  const res = await api(path, {
    method: body ? 'POST' : 'GET',
    body: body ? JSON.stringify(body) : undefined,
  });
  return res.json();
}

function stopGeneration() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
}

/* ═══════════════════════════════════════════════════════════════
   Server Health Check
   ═══════════════════════════════════════════════════════════════ */
async function checkHealth() {
  const dot = document.getElementById('server-dot');
  const url = document.getElementById('server-url');
  try {
    const data = await apiJSON('/health');
    dot.classList.add('online');
    url.textContent = `v${data.version} @ ${API}`;
    return true;
  } catch {
    dot.classList.remove('online');
    url.textContent = `Offline — ${API}`;
    return false;
  }
}

/* Tab Switching */
function switchTab(tab) {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('nav button[data-tab="' + tab + '"]');
  if (btn) btn.classList.add('active');
  document.getElementById('tab-chat').style.display = tab === 'chat' ? 'flex' : 'none';
  document.getElementById('tab-stats').style.display = tab === 'stats' ? 'block' : 'none';
  document.getElementById('tab-models').style.display = tab === 'models' ? 'block' : 'none';
  if (tab === 'stats') refreshStats();
  if (tab === 'models') { if (!scanned) { scanModels(); scanned = true; } refreshModels(); }
  window.location.hash = tab;
}

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', function() { switchTab(this.dataset.tab); });
});

// Restore tab on page load or hash change
function restoreTab() {
  const hash = (window.location.hash || '').replace('#', '');
  const valid = ['chat', 'stats', 'models'];
  switchTab(valid.includes(hash) ? hash : 'chat');
}
window.addEventListener('hashchange', restoreTab);
window.addEventListener('DOMContentLoaded', restoreTab);

/* ═══════════════════════════════════════════════════════════════
   Chat
   ═══════════════════════════════════════════════════════════════ */
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const sendBtn = document.getElementById('send-btn');
const stopBtn = document.getElementById('stop-btn');
const SYSTEM_PROMPT = 'You are a helpful, respectful, and honest assistant. Answer the user directly and concisely. Always reply in the same language the user writes in (if the user writes Thai, reply in Thai; if English, reply in English).';

function addMessage(role, content, isError) {
  const div = document.createElement('div');
  div.className = 'message ' + role + (isError ? ' error' : '');
  div.innerHTML = '<div class="role">' + role + '</div>' + escapeHtml(content).replace(/\n/g, '<br>');
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  
  const online = await checkHealth();
  if (!online) { addMessage('error', 'Server is offline', true); return; }
  
  chatInput.value = '';
  addMessage('user', text);
  
  sendBtn.disabled = true;
  stopBtn.style.display = 'inline-block';
  
  // Build messages with conversation history + system prompt
  var messages = [{ role: 'system', content: SYSTEM_PROMPT }];
  for (var i = 0; i < conversationHistory.length; i++) {
    messages.push(conversationHistory[i]);
  }
  messages.push({ role: 'user', content: text });
  
  var msgDiv = document.createElement('div');
  msgDiv.className = 'message assistant';
  msgDiv.innerHTML = '<div class="role">assistant</div><span class="loading"></span>';
  chatMessages.appendChild(msgDiv);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  
  abortController = new AbortController();
  var fullResponse = '';
  
  try {
    var res = await fetch(API + '/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: currentModel, messages: messages, max_tokens: 256, temperature: 0.3, stream: true }),
      signal: abortController.signal,
    });
    
    if (!res.ok) {
      var err = await res.json().catch(function() { return { detail: res.statusText }; });
      throw new Error(err.detail || err.error || 'HTTP ' + res.status);
    }
    
    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    var buffer = '';
    
    while (true) {
      var result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop();
      for (var li = 0; li < lines.length; li++) {
        var line = lines[li];
        if (line.startsWith('data: ')) {
          var data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            var event = JSON.parse(data);
            var delta = (event.choices && event.choices[0] && event.choices[0].delta && event.choices[0].delta.content);
            if (delta) {
              fullResponse += delta;
              msgDiv.innerHTML = '<div class="role">assistant</div>' + escapeHtml(fullResponse).replace(/\n/g, '<br>');
              chatMessages.scrollTop = chatMessages.scrollHeight;
            }
          } catch(e) {}
        }
      }
    }
    
    if (!fullResponse) {
      msgDiv.innerHTML = '<div class="role">assistant</div><em>(empty response)</em>';
    }
    
    // Save to conversation history
    conversationHistory.push({ role: 'user', content: text });
    conversationHistory.push({ role: 'assistant', content: fullResponse });
    if (conversationHistory.length > 20) conversationHistory = conversationHistory.slice(-20);
    saveChatHistory();
    
  } catch (e) {
    if (e.name === 'AbortError') {
      msgDiv.innerHTML = '<div class="role">assistant</div>' + escapeHtml(fullResponse).replace(/\n/g, '<br>') + ' <em style="color:var(--text-dim);">[stopped]</em>';
    } else {
      msgDiv.className = 'message error';
      msgDiv.innerHTML = '<div class="role">error</div>' + escapeHtml(e.message);
    }
  }
  
  sendBtn.disabled = false;
  stopBtn.style.display = 'none';
  abortController = null;
  refreshStats();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML.replace(/\n/g, '<br>');
}

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);
stopBtn.addEventListener('click', stopGeneration);

/* ═══════════════════════════════════════════════════════════════
   Stats
   ═══════════════════════════════════════════════════════════════ */
async function refreshStats() {
  const grid = document.getElementById('stats-grid');
  const footer = document.getElementById('stats-footer');
  try {
    const data = await apiJSON('/v1/stats');
    const models = data.models || {};
    const server = data.server || {};
    footer.textContent = `${server.models_loaded || 0} models loaded`;
    
    let html = '';
    for (const [mid, ms] of Object.entries(models)) {
      const buf = ms.buffer || {};
      const pref = ms.prefetcher || {};
      const page = ms.page_cache || {};
      const gen = ms.generation || {};
      
      html += `<div style="grid-column:1/-1;font-weight:600;color:var(--primary);margin-top:8px;">${escapeHtml(mid)}</div>`;
      html += card('Hit Rate', `${(buf.hit_rate * 100).toFixed(1)}%`);
      html += card('Hot Shards', `${buf.hot_shards}/${buf.capacity_shards}`);
      html += card('Prefetches', pref.prefetched || '0');
      html += card('Resident', `${(page.resident_ratio * 100).toFixed(1)}%`);
      html += card('Speed', `${(gen.tokens_per_sec || 0).toFixed(1)} tok/s`);
      html += card('Tokens', gen.token_count || '0');
    }
    if (!html) {
      html = '<div class="stat-card"><div class="stat-label">No models loaded</div></div>';
    }
    grid.innerHTML = html;
  } catch (e) {
    grid.innerHTML = `<div class="stat-card" style="color:var(--error);">Error: ${escapeHtml(e.message)}</div>`;
  }
}

function card(label, value) {
  return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${value}</div></div>`;
}

/* ═══════════════════════════════════════════════════════════════
   Models
   ═══════════════════════════════════════════════════════════════ */
async function refreshModels() {
  const list = document.getElementById('models-list');
  const reloadBtn = document.getElementById('reload-btn');
  const loadBtn = document.getElementById('load-btn');
  const loadMsg = document.getElementById('load-msg');
  const loadHeader = document.getElementById('load-header');
  
  try {
    const models = await apiJSON('/v1/models');
    if (!models || models.length === 0) {
      list.innerHTML = '<p style="color:var(--text-dim);">No models loaded yet. Select one below and click Load Model.</p>';
      reloadBtn.style.display = 'none';
      loadBtn.style.display = 'inline-block';
      loadHeader.textContent = 'Load Model';
      loadMsg.textContent = '';
      return;
    }
    
    list.innerHTML = models.map(m => `
      <div class="model-card">
        <div>
          <div class="model-name">${escapeHtml(m.id)}</div>
          <div class="model-meta">${escapeHtml(m.path || '')} · ${m.arch || 'unknown'} · ${m.n_experts} experts</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="badge loaded">loaded</span>
          <button onclick="unloadModel('${escapeHtml(m.id)}')" style="background:none;border:1px solid var(--border);color:var(--text-dim);padding:4px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8em;">Unload</button>
        </div>
      </div>
    `).join('');
    
    // Set current model and update load form
    const loaded = models[0];
    currentModel = loaded.id;
    document.getElementById('load-path').value = loaded.path || '';
    document.getElementById('load-id').value = loaded.id;
    
    reloadBtn.style.display = 'inline-block';
    loadBtn.style.display = 'none';
    loadHeader.textContent = 'Model Loaded';
    loadMsg.innerHTML = '<span style="color:var(--success);">Model <b>' + escapeHtml(loaded.id) + '</b> is loaded and ready.</span>';
  } catch (e) {
    list.innerHTML = '<p style="color:var(--error);">Error: ' + escapeHtml(e.message) + '</p>';
  }
}

async function scanModels(dir) {
  const picker = document.getElementById('model-picker');
  var url = '/v1/models/scan';
  if (dir) url += '?dir=' + encodeURIComponent(dir);
  
  try {
    const data = await apiJSON(url);
    const models = data.models || [];
    var html = '<option value="">-- Select a model (' + models.length + ' found) --</option>';
    for (var i = 0; i < models.length; i++) {
      var m = models[i];
      var label = m.name + ' (' + m.size_gb + ' GB)';
      if (m.architecture && m.architecture !== 'unknown') label += ' [' + m.architecture + ']';
      if (m.may_need_upgrade) label += ' ⚠ needs newer llama-cpp';
      html += '<option value="' + escapeHtml(m.path) + '">' + escapeHtml(label) + '</option>';
    }
    if (models.length === 0) {
      html = '<option value="">No .gguf files found. Try scanning a different directory.</option>';
    }
    picker.innerHTML = html;
  } catch (e) {
    picker.innerHTML = '<option value="">Scan error: ' + escapeHtml(e.message) + '</option>';
  }
}

// Native browse: open Windows file dialog on server
async function browseModel() {
  const msg = document.getElementById('load-msg');
  msg.innerHTML = '<span style="color:var(--warn);">Opening file dialog... (check taskbar if not visible)</span>';
  try {
    const data = await apiJSON('/v1/browse');
    if (data.error) {
      msg.innerHTML = '<span style="color:var(--error);">Browse error: ' + escapeHtml(data.error) + '</span>';
      return;
    }
    if (data.cancelled || !data.path) {
      msg.innerHTML = '<span style="color:var(--text-dim);">Browse cancelled.</span>';
      return;
    }
    document.getElementById('load-path').value = data.path;
    const name = data.name.replace('.gguf', '').replace(/[^a-zA-Z0-9_-]/g, '-');
    document.getElementById('load-id').value = name || 'default';
    pickerAddOption(data.path, data.name + ' (' + data.size_gb + ' GB)');
    document.getElementById('load-btn').style.display = 'inline-block';
    document.getElementById('reload-btn').style.display = 'none';
    msg.innerHTML = '<span style="color:var(--success);">Selected: ' + escapeHtml(data.name) + ' — click Load Model</span>';
  } catch(e) {
    msg.innerHTML = '<span style="color:var(--error);">Browse failed: ' + escapeHtml(e.message) + '</span>';
  }
}

async function browseDir() {
  const msg = document.getElementById('load-msg');
  msg.innerHTML = '<span style="color:var(--warn);">Opening folder dialog... (check taskbar if not visible)</span>';
  try {
    const data = await apiJSON('/v1/browse-dir');
    if (data.error) {
      msg.innerHTML = '<span style="color:var(--error);">Browse error: ' + escapeHtml(data.error) + '</span>';
      return;
    }
    if (data.cancelled || !data.path) {
      msg.innerHTML = '<span style="color:var(--text-dim);">Browse cancelled.</span>';
      return;
    }
    document.getElementById('scan-dir').value = data.path;
    msg.innerHTML = '<span style="color:var(--warn);">Scanning: ' + escapeHtml(data.path) + '</span>';
    await scanModels(data.path);
    msg.innerHTML = '<span style="color:var(--success);">Scanned: ' + escapeHtml(data.path) + '</span>';
  } catch(e) {
    msg.innerHTML = '<span style="color:var(--error);">Browse failed: ' + escapeHtml(e.message) + '</span>';
  }
}

function scanDirCustom() {
  var dir = document.getElementById('scan-dir').value.trim();
  if (dir) scanModels(dir);
  else alert('Enter a directory path first');
}



function pickerAddOption(path, label) {
  const picker = document.getElementById('model-picker');
  if (!picker.querySelector('option[value="' + path.replace(/"/g, '') + '"]')) {
    const opt = document.createElement('option');
    opt.value = path;
    opt.textContent = label;
    picker.appendChild(opt);
    picker.value = path;
  }
}

// Scan button: scan the custom directory
document.getElementById('scan-dir-btn').addEventListener('click', function() {
  var dir = document.getElementById('scan-dir').value.trim();
  scanModels(dir || null);
});

// Also scan on Enter in scan-dir input
document.getElementById('scan-dir').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    scanModels(this.value.trim() || null);
  }
});

// Dropdown selection → auto-fill path + ID
document.getElementById('model-picker').addEventListener('change', function() {
  const path = this.value;
  if (path) {
    document.getElementById('load-path').value = path;
    const name = path.split(/[\\/]/).pop().replace('.gguf', '').replace(/[^a-zA-Z0-9_-]/g, '-');
    document.getElementById('load-id').value = name || 'default';
    document.getElementById('load-btn').style.display = 'inline-block';
    document.getElementById('reload-btn').style.display = 'none';
  }
});

async function loadModel(force) {
  const path = document.getElementById('load-path').value.trim();
  const id = document.getElementById('load-id').value.trim() || 'default';
  const buffer = parseInt(document.getElementById('load-buffer').value) || 64;
  const ctx = parseInt(document.getElementById('load-ctx').value) || 512;
  const loadMsg = document.getElementById('load-msg');
  
  if (!path) { loadMsg.innerHTML = '<span style="color:var(--error);">Please enter or select a model path.</span>'; return; }
  
  const btn = force ? document.getElementById('reload-btn') : document.getElementById('load-btn');
  btn.disabled = true;
  btn.textContent = force ? 'Reloading...' : 'Loading...';
  loadMsg.innerHTML = '<span style="color:var(--warn);">Loading model... this may take a minute.</span>';
  
  try {
    const body = { model_id: id, model_path: path, buffer_mb: buffer, n_ctx: ctx };
    if (force) body.force = true;
    await apiJSON('/v1/models/load', body);
    currentModel = id;
    loadMsg.innerHTML = '<span style="color:var(--success);">Loaded! Model <b>' + escapeHtml(id) + '</b> is ready for chat.</span>';
    await refreshModels();
  } catch (e) {
    const msg = e.message || 'Unknown error';
    if (msg.includes('already loaded')) {
      loadMsg.innerHTML = '<span style="color:var(--warn);">Model already loaded. Click Reload to force reload.</span>';
      document.getElementById('reload-btn').style.display = 'inline-block';
      document.getElementById('load-btn').style.display = 'none';
    } else {
      loadMsg.innerHTML = '<span style="color:var(--error);">Load failed: ' + escapeHtml(msg) + '</span>';
    }
  }
  btn.disabled = false;
  btn.textContent = force ? 'Reload (Force)' : 'Load Model';
}

async function unloadModel(id) {
  try {
    await apiJSON('/v1/models/unload', { model_id: id });
    document.getElementById('load-msg').textContent = '';
    await refreshModels();
    if (currentModel === id) currentModel = 'default';
  } catch (e) {
    alert('Unload failed: ' + e.message);
  }
}

document.getElementById('load-btn').addEventListener('click', function() { loadModel(false); });
document.getElementById('reload-btn').addEventListener('click', function() { loadModel(true); });

/* ═══════════════════════════════════════════════════════════════
   Theme Toggle
   ═══════════════════════════════════════════════════════════════ */
document.getElementById('theme-toggle').addEventListener('click', () => {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
  localStorage.setItem('ws-theme', current === 'dark' ? 'light' : 'dark');
});

// Load saved theme
const saved = localStorage.getItem('ws-theme');
if (saved) document.documentElement.setAttribute('data-theme', saved);

   Init

checkHealth();
setInterval(checkHealth, 10000);
refreshModels();
restoreChatUI();
restoreTab();
document.getElementById('chat-input').focus();
</script>
