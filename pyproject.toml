[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weight-streaming"
version = "0.12.0"
description = "Run LLMs larger than your RAM — speculative weight streaming from NVMe"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Weight Streaming Contributors" },
]
keywords = [
    "llm", "inference", "moe", "streaming", "nvme", "mmap",
    "mixture-of-experts", "weight-streaming", "large-language-model",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
llama-cpp = ["llama-cpp-python>=0.3.34"]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.2.0",
    "websockets>=13.0",
]
gradio = ["gradio>=5.0.0"]
tui = ["textual>=1.0.0", "rich>=13.0.0"]
all = ["weight-streaming[llama-cpp,server,gradio,tui]"]

[project.urls]
homepage = "https://github.com/weight-streaming/weight-streaming"
source = "https://github.com/weight-streaming/weight-streaming"
documentation = "https://github.com/weight-streaming/weight-streaming"
issues = "https://github.com/weight-streaming/weight-streaming/issues"

[project.scripts]
weight-streaming = "weight_stream.cli.main:main"

[tool.setuptools.packages.find]
include = ["weight_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
